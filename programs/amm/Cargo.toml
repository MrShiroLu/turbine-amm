[package]
name = "amm"
version = "0.1.0"
description = "Constant-product AMM — Turbine Solana Builders"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "amm"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"

# dev-dependencies for the LiteSVM test crate live in ../../tests/Cargo.toml
# (kept out of this crate so `anchor build` / cargo-build-sbf is not affected).
